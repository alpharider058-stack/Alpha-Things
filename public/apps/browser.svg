<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="browserBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091326"/>
      <stop offset="50%" stop-color="#0f1f3d"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="browserGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="browserGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.28)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
    <linearGradient id="compassRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="compassSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="browserShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- App rounded tile background -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#browserBg)" stroke="rgba(56,189,248,0.3)" stroke-width="1.5"/>
  <rect x="7" y="7" width="114" height="57" rx="27" fill="url(#browserGlass)"/>

  <!-- Globe & Compass Hybrid Graphic -->
  <g filter="url(#browserShadow)">
    <!-- Globe Outer Ring -->
    <circle cx="64" cy="64" r="38" fill="none" stroke="url(#browserGlow)" stroke-width="3.5" opacity="0.95"/>
    <circle cx="64" cy="64" r="37.5" fill="#0b1b36" opacity="0.4"/>

    <!-- Globe Longitudes / Latitudes (Crystalline Lines) -->
    <ellipse cx="64" cy="64" rx="22" ry="38" fill="none" stroke="rgba(56,189,248,0.45)" stroke-width="1.5" stroke-dasharray="3 2"/>
    <line x1="26" y1="64" x2="102" y2="64" stroke="rgba(56,189,248,0.5)" stroke-width="1.5"/>
    <ellipse cx="64" cy="46" rx="32" ry="10" fill="none" stroke="rgba(56,189,248,0.3)" stroke-width="1.2"/>
    <ellipse cx="64" cy="82" rx="32" ry="10" fill="none" stroke="rgba(56,189,248,0.3)" stroke-width="1.2"/>

    <!-- Compass Dial Marks -->
    <circle cx="64" cy="29" r="2" fill="#38bdf8"/>
    <circle cx="99" cy="64" r="2" fill="#38bdf8"/>
    <circle cx="64" cy="99" r="2" fill="#38bdf8"/>
    <circle cx="29" cy="64" r="2" fill="#38bdf8"/>

    <!-- Dynamic Compass Needle (Oriented North-East) -->
    <g transform="rotate(35 64 64)">
      <!-- North tip (Red) -->
      <polygon points="64,30 58.5,64 64,60" fill="url(#compassRed)"/>
      <polygon points="64,30 69.5,64 64,60" fill="#dc2626"/>
      <!-- South tip (White/Silver) -->
      <polygon points="64,98 58.5,64 64,68" fill="url(#compassSilver)"/>
      <polygon points="64,98 69.5,64 64,68" fill="#cbd5e1"/>
      <!-- Central Pivot Pin -->
      <circle cx="64" cy="64" r="5" fill="#ffffff"/>
      <circle cx="64" cy="64" r="2.5" fill="#0284c7"/>
    </g>
  </g>
</svg>
