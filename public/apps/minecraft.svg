<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="mcGrassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b8731"/>
      <stop offset="40%" stop-color="#466c24"/>
      <stop offset="100%" stop-color="#345218"/>
    </linearGradient>
    <linearGradient id="mcDirtGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#866043"/>
      <stop offset="50%" stop-color="#6b4c33"/>
      <stop offset="100%" stop-color="#513824"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="blockShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" filter="url(#blockShadow)"/>
  
  <!-- Subtle specular reflection -->
  <path d="M 32 7 Q 64 6 96 7" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" fill="none"/>

  <!-- Minecraft 3D Isometric Grass Block -->
  <g transform="translate(64, 62) scale(1.18)" filter="url(#blockShadow)">
    <!-- Top Face (Grass) -->
    <polygon points="0,-30 30,-14 0,2 -30,-14" fill="#5c8e32" stroke="#3d631e" stroke-width="1"/>
    <!-- Top face pixel texture details -->
    <polygon points="-12,-16 0,-22 12,-16 0,-10" fill="#6ba038"/>
    <polygon points="-6,-18 0,-21 6,-18 0,-15" fill="#78b13f"/>
    <polygon points="8,-22 18,-17 12,-14 2,-19" fill="#4d7729"/>

    <!-- Left Face (Dirt + Grass overhang) -->
    <polygon points="-30,-14 0,2 0,34 -30,18" fill="#6b4b32" stroke="#4a3220" stroke-width="1"/>
    <!-- Left Face Grass Dripping -->
    <polygon points="-30,-14 0,2 0,11 -8,7 -12,12 -20,6 -25,10 -30,7" fill="#4d7729"/>
    <!-- Left Face Dirt pixel spots -->
    <polygon points="-22,14 -14,18 -14,24 -22,20" fill="#523926"/>
    <polygon points="-8,18 -2,21 -2,26 -8,23" fill="#845e3f"/>
    <polygon points="-18,22 -10,26 -10,30 -18,26" fill="#432c1c"/>

    <!-- Right Face (Dirt + Grass overhang, darker side) -->
    <polygon points="0,2 30,-14 30,18 0,34" fill="#573c27" stroke="#3b2718" stroke-width="1"/>
    <!-- Right Face Grass Dripping -->
    <polygon points="0,2 30,-14 30,-5 24,-2 20,4 12,0 8,5 0,1" fill="#3d631e"/>
    <!-- Right Face Dirt pixel spots -->
    <polygon points="8,14 18,9 18,15 8,20" fill="#462f1e"/>
    <polygon points="14,19 24,14 24,19 14,24" fill="#6d4c32"/>
    <polygon points="4,22 12,18 12,24 4,28" fill="#382416"/>
  </g>

  <!-- Pickaxe Badge Accent in bottom right -->
  <g transform="translate(86, 86)">
    <circle cx="10" cy="10" r="14" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <!-- Diamond Pickaxe simple pixel icon -->
    <path d="M 5 15 L 15 5" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 12 4 Q 16 4 17 8 L 15 9 L 9 3 L 12 4 Z" fill="#06b6d4"/>
  </g>
</svg>
