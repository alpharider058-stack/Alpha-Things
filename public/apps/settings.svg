<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="setBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="gearGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#71717a"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#setBg)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <g transform="translate(64,64)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="url(#gearGrad)" stroke-width="8"/>
    <!-- Gear teeth -->
    
      <rect x="-4" y="-32" width="8" height="10" rx="2" fill="url(#gearGrad)" transform="rotate(0)"/>
    
      <rect x="-4" y="-32" width="8" height="10" rx="2" fill="url(#gearGrad)" transform="rotate(45)"/>
    
      <rect x="-4" y="-32" width="8" height="10" rx="2" fill="url(#gearGrad)" transform="rotate(90)"/>
    
      <rect x="-4" y="-32" width="8" height="10" rx="2" fill="url(#gearGrad)" transform="rotate(135)"/>
    
      <rect x="-4" y="-32" width="8" height="10" rx="2" fill="url(#gearGrad)" transform="rotate(180)"/>
    
      <rect x="-4" y="-32" width="8" height="10" rx="2" fill="url(#gearGrad)" transform="rotate(225)"/>
    
      <rect x="-4" y="-32" width="8" height="10" rx="2" fill="url(#gearGrad)" transform="rotate(270)"/>
    
      <rect x="-4" y="-32" width="8" height="10" rx="2" fill="url(#gearGrad)" transform="rotate(315)"/>
    
  </g>
</svg>