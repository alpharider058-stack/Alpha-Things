<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <clipPath id="board-clip">
      <rect x="90" y="105" width="820" height="790" rx="6" ry="6" />
    </clipPath>
  </defs>

  <!-- Yellow/Gold Frame with rounded outer corners -->
  <rect x="0" y="0" width="1000" height="1000" rx="160" ry="160" fill="#F4B400" />

  <!-- Bottom-right shadow inside frame -->
  <path d="M 580 895 L 795 1000 L 840 1000 C 930 1000 1000 930 1000 840 L 1000 680 L 910 895 Z" fill="#E37400" opacity="0.6" />

  <!-- Green Chalkboard Area -->
  <rect x="90" y="105" width="820" height="790" fill="#137333" />
  <rect x="90" y="105" width="820" height="790" fill="#1E8E3E" />

  <!-- Chalkboard Shadow at bottom right -->
  <path d="M 580 895 L 910 895 L 910 565 Z" fill="#188038" clip-path="url(#board-clip)" opacity="0.5" />

  <!-- Left Classmate (Green silhouette) -->
  <circle cx="320" cy="465" r="70" fill="#2DA967" />
  <path d="M 205 685 C 205 605 255 560 320 560 C 385 560 435 605 435 685 Z" fill="#2DA967" />

  <!-- Right Classmate (Green silhouette) -->
  <circle cx="680" cy="465" r="70" fill="#2DA967" />
  <path d="M 565 685 C 565 605 615 560 680 560 C 745 560 795 605 795 685 Z" fill="#2DA967" />

  <!-- Center Student / Teacher (White silhouette) -->
  <circle cx="500" cy="395" r="95" fill="#FFFFFF" />
  <path d="M 340 685 C 340 575 410 525 500 525 C 590 525 660 575 660 685 Z" fill="#FFFFFF" />

  <!-- White Chalk on bottom right of the board -->
  <rect x="590" y="840" width="205" height="55" rx="4" ry="4" fill="#FFFFFF" />

  <!-- Chalk Cast Shadow across yellow frame -->
  <path d="M 590 895 L 795 895 L 900 1000 L 760 1000 Z" fill="#D48800" opacity="0.45" />
</svg>
